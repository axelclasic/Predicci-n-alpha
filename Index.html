<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.P.A. Pro v4.8 - Consenso Multi-Liga</title>
    <style>
        :root {
            --bg-principal: #0b0f19;
            --bg-tarjetas: #151f32;
            --bg-interacciones: #222f47;
            --texto-blanco: #f1f5f9;
            --texto-mutado: #64748b;
            --oro-sugerencia: #eab308;
            --verde-exito: #10b981;
            --azul-top3: #3b82f6;
            --rojo-error: #ef4444;
            --glow-top3: rgba(59, 130, 246, 0.25);
            --glow-liga: rgba(16, 185, 129, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-blanco);
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--bg-interacciones);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .btn-refresh {
            background: var(--bg-interacciones);
            color: var(--texto-blanco);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .paneles-estadisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .panel-rendimiento {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--bg-interacciones);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel-rendimiento.top3 {
            border: 1px solid rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #10223f 0%, #0f172a 100%);
        }

        .panel-rendimiento h3 {
            font-size: 0.75rem;
            color: var(--texto-mutado);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .panel-rendimiento.top3 h3 {
            color: var(--azul-top3);
            font-weight: bold;
        }

        .porcentaje-grande {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--texto-blanco);
            line-height: 1;
            margin-bottom: 4px;
        }

        .panel-rendimiento.top3 .porcentaje-grande {
            color: var(--azul-top3);
        }

        .sub-conteo {
            font-size: 0.75rem;
            color: var(--texto-mutado);
        }

        .seccion-predicciones h2 {
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: var(--texto-blanco);
            font-weight: 600;
        }

        .grid-juegos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card-juego {
            background-color: var(--bg-tarjetas);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid var(--bg-interacciones);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Estilo para el Top 3 Global (Azul Radiante) */
        .card-juego.top3-premium {
            border: 2px solid var(--azul-top3);
            background: linear-gradient(145deg, #10223f 0%, #151f32 100%);
            box-shadow: 0 4px 15px var(--glow-top3);
        }

        /* Estilo para los destacados por Liga (Verdes) */
        .card-juego.liga-premium {
            border: 2px solid var(--verde-exito);
            background: linear-gradient(145deg, #112420 0%, #151f32 100%);
            box-shadow: 0 4px 15px var(--glow-liga);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--texto-mutado);
        }

        .badges-grupo {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-liga {
            background: rgba(241, 245, 249, 0.08);
            color: var(--texto-blanco);
            border: 1px solid rgba(241, 245, 249, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.68rem;
        }

        .badge-sistema {
            background: rgba(234, 179, 8, 0.1);
            color: var(--oro-sugerencia);
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.7rem;
        }

        .badge-top3 {
            background: var(--azul-top3);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.7rem;
        }

        .badge-liga-top {
            background: var(--verde-exito);
            color: #0b0f19;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.7rem;
        }

        .duelo-equipos {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bloque-sugerencia-automatica {
            margin-top: 5px;
            background: rgba(234, 179, 8, 0.02);
            border: 1px dashed var(--oro-sugerencia);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-juego.top3-premium .bloque-sugerencia-automatica {
            background: rgba(59, 130, 246, 0.02);
            border: 1px dashed var(--azul-top3);
        }

        .card-juego.liga-premium .bloque-sugerencia-automatica {
            background: rgba(16, 185, 129, 0.02);
            border: 1px dashed var(--verde-exito);
        }

        .info-sugerencia { display: flex; flex-direction: column; }
        .tag-tipo-logro { font-size: 0.7rem; color: var(--oro-sugerencia); font-weight: bold; margin-bottom: 2px; }
        .card-juego.top3-premium .tag-tipo-logro { color: var(--azul-top3); }
        .card-juego.liga-premium .tag-tipo-logro { color: var(--verde-exito); }
        .seleccion-texto { font-size: 0.85rem; font-weight: 600; }
        
        .cuota-valor {
            font-size: 0.85rem; font-weight: bold; background: var(--oro-sugerencia);
            color: #000; padding: 3px 8px; border-radius: 4px;
        }
        .card-juego.top3-premium .cuota-valor { background: var(--azul-top3); color: #ffffff; }
        .card-juego.liga-premium .cuota-valor { background: var(--verde-exito); color: #0b0f19; }

        .no-data { color: var(--texto-mutado); font-size: 0.85rem; text-align: center; padding: 30px 0; }
        .error-texto { color: var(--rojo-error); font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px; border: 1px solid var(--rojo-error); margin-top: 10px; }
        
        #js-status { font-weight: bold; font-size: 0.75rem; display: block; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>S.I.P.A. Consensus</h1>
        <button class="btn-refresh" id="btn-sincronizar">Sincronizar 🔄</button>
    </header>

    <div class="paneles-estadisticas">
        <div class="panel-rendimiento top3">
            <h3>Efectividad Top 3 💎</h3>
            <div class="porcentaje-grande" id="top3-winrate">0%</div>
            <div class="sub-conteo" id="top3-conteo">Evaluando...</div>
        </div>

        <div class="panel-rendimiento global">
            <h3>Global Seguro</h3>
            <div class="porcentaje-grande" id="global-winrate">0%</div>
            <div class="sub-conteo" id="global-conteo">Evaluando...</div>
        </div>
    </div>

    <div class="seccion-predicciones">
        <h2>Pizarra Multi-Liga (Filtro -140 a -250)</h2>
        <div class="grid-juegos" id="contenedor-pizarra">
            <p class="no-data" id="texto-carga">
                Cargando pizarra oficial (MLB / NBA / NHL)...<br>
                <span id="js-status" style="color:var(--rojo-error)">[Esperando arranque JS...]</span>
            </p>
        </div>
    </div>

    <script>
        // CAZADOR DE ERRORES ABSOLUTO
        window.onerror = function(msg, url, line) {
            var c = document.getElementById('contenedor-pizarra');
            if(c) c.innerHTML = '<div class="error-texto">💥 ERROR JS FATAL: ' + msg + ' (Línea ' + line + '). Asegúrate de haber copiado todo el código hasta la última línea.</div>';
            return false;
        };

        // MOTOR PRINCIPAL
        (async function() {
            var API_KEY = 'b55dc1db9b4f0aea7bdd5100a9952c00'; 
            var DEPORTES = [
                { key: 'baseball_mlb', nombre: 'MLB', icono: '⚾', unidadTotal: 'Carreras' },
                { key: 'basketball_nba', nombre: 'NBA', icono: '🏀', unidadTotal: 'Puntos' },
                { key: 'icehockey_nhl', nombre: 'NHL', icono: '🏒', unidadTotal: 'Goles' }
            ];
            
            var CACHE_JUEGOS = 'sipa_data_v48';
            var CACHE_TIEMPO = 'sipa_time_v48';
            var REGISTRO_PREDICCIONES = 'sipa_historial_v48';

            var statusDiv = document.getElementById('js-status');
            var contenedor = document.getElementById('contenedor-pizarra');
            
            if(statusDiv) {
                statusDiv.innerText = "[Motor JS en línea 🟢]";
                statusDiv.style.color = "var(--verde-exito)";
            }

            document.getElementById('btn-sincronizar').addEventListener('click', function() {
                localStorage.removeItem(CACHE_JUEGOS);
                localStorage.removeItem(CACHE_TIEMPO);
                descargarDatos();
            });

            function obtenerInfoDeporte(sportKey) {
                return DEPORTES.find(d => d.key === sportKey) || { key: sportKey, nombre: 'LIGA', icono: '🏆', unidadTotal: 'Total' };
            }

            async function descargarDatos() {
                if(contenedor) contenedor.innerHTML = '<p class="no-data">Conectando con la API (MLB, NBA, NHL) y filtrando cuotas...</p>';
                
                try {
                    var promesas = DEPORTES.map(dep => {
                        var url = 'https://api.the-odds-api.com/v4/sports/' + dep.key + '/odds/?apiKey=' + API_KEY + '&regions=us&markets=h2h,spreads,totals&oddsFormat=american';
                        return fetch(url).then(res => {
                            if (!res.ok) return [];
                            return res.json();
                        }).catch(() => []);
                    });

                    var resultadosPorLiga = await Promise.all(promesas);
                    var todosLosPartidos = resultadosPorLiga.flat();

                    if (!todosLosPartidos || todosLosPartidos.length === 0) {
                        contenedor.innerHTML = '<p class="no-data">No hay juegos programados en MLB, NBA o NHL ahora mismo.</p>';
                        return;
                    }

                    localStorage.setItem(CACHE_JUEGOS, JSON.stringify(todosLosPartidos));
                    localStorage.setItem(CACHE_TIEMPO, new Date().getTime().toString());
                    
                    procesarConsensoMercado(todosLosPartidos);
                    await verificarResultados();
                    actualizarDashboard();
                } catch (error) {
                    if(contenedor) contenedor.innerHTML = '<div class="error-texto">⚠️ Fallo de red: ' + error.message + '</div>';
                }
            }

            function procesarConsensoMercado(partidos) {
                if(!contenedor) return;

                var historialPredicciones = [];
                try {
                    var guardado = localStorage.getItem(REGISTRO_PREDICCIONES);
                    if (guardado) historialPredicciones = JSON.parse(guardado);
                } catch(e) {}
                
                var listaSugerencias = [];

                partidos.forEach(partido => {
                    if (!partido.bookmakers || partido.bookmakers.length === 0) return;
                    var infoDep = obtenerInfoDeporte(partido.sport_key);
                    var mapaResultados = {};

                    partido.bookmakers.forEach(bookmaker => {
                        if (!bookmaker.markets) return;
                        bookmaker.markets.forEach(market => {
                            if (!market.outcomes) return; 
                            
                            market.outcomes.forEach(out => {
                                if (typeof out.price !== 'number') return; 
                                
                                var pTxt = out.point !== undefined ? out.point : '';
                                var llave = market.key + '_' + out.name + '_' + pTxt;

                                if (!mapaResultados[llave]) {
                                    var lbl = market.key === 'h2h' ? 'Gana Directo (ML)' : 
                                              market.key === 'spreads' ? 'Hándicap (' + out.point + ')' : 
                                              'Total ' + infoDep.unidadTotal + ' (' + out.name + ' ' + out.point + ')';

                                    mapaResultados[llave] = {
                                        market: market.key, name: out.name, point: pTxt,
                                        label: lbl, sumaPrecios: 0, contadorCasas: 0
                                    };
                                }
                                mapaResultados[llave].sumaPrecios += out.price;
                                mapaResultados[llave].contadorCasas++;
                            });
                        });
                    });

                    var mejoresOpciones = [];
                    for (var k in mapaResultados) {
                        var opt = mapaResultados[k];
                        if(opt.contadorCasas === 0) continue;
                        
                        var precioPromedio = Math.round(opt.sumaPrecios / opt.contadorCasas);
                        if (precioPromedio <= -140 && precioPromedio >= -250) {
                            opt.price = precioPromedio;
                            mejoresOpciones.push(opt);
                        }
                    }

                    if (mejoresOpciones.length > 0) {
                        mejoresOpciones.sort((a, b) => a.price - b.price);
                        listaSugerencias.push({ partido: partido, logro: mejoresOpciones[0], deporte: infoDep });
                    }
                });

                if (listaSugerencias.length === 0) {
                    contenedor.innerHTML = '<p class="no-data">Ningún juego de MLB, NBA o NHL cumple hoy con el filtro inteligente (-140 a -250).</p>';
                    return;
                }

                // Orden principal por probabilidad/precio (menor cuota negativa primero)
                listaSugerencias.sort((a, b) => a.logro.price - b.logro.price);

                // 1. Seleccionamos las 3 mejores globales (Azul)
                var idsTop3Globales = new Set();
                var itemsTop3Globales = listaSugerencias.slice(0, 3);
                itemsTop3Globales.forEach(item => idsTop3Globales.add(item.partido.id));

                // 2. Seleccionamos las 3 mejores de cada liga (excluyendo las que ya están en el Top 3 Global si es posible)
                var topLigaPorDeporte = [];
                DEPORTES.forEach(dep => {
                    var deEstaLiga = listaSugerencias.filter(item => item.deporte.key === dep.key && !idsTop3Globales.has(item.partido.id));
                    if (deEstaLiga.length === 0) {
                        deEstaLiga = listaSugerencias.filter(item => item.deporte.key === dep.key);
                    }
                    deEstaLiga.slice(0, 3).forEach(item => {
                        topLigaPorDeporte.push(item);
                        idsTop3Globales.add(item.partido.id); // Para evitar duplicados innecesarios
                    });
                });

                // 3. El resto de las apuestas ordenadas por probabilidad
                var restoApuestas = listaSugerencias.filter(item => !idsTop3Globales.has(item.partido.id));

                var htmlFinal = '';

                // Renderizar Top 3 Global (Azul Radiante)
                itemsTop3Globales.forEach((item, index) => {
                    htmlFinal += construirTarjeta(item, 'top3-premium', '💎 TOP 3', item.deporte);
                });

                // Renderizar Top 3 por Liga (Verde)
                topLigaPorDeporte.forEach((item, index) => {
                    htmlFinal += construirTarjeta(item, 'liga-premium', '⭐ ' + item.deporte.nombre + ' TOP', item.deporte);
                });

                // Renderizar el resto de la pizarra ordenadas por probabilidad
                restoApuestas.forEach((item, index) => {
                    htmlFinal += construirTarjeta(item, '', 'CONSENSO', item.deporte);
                });

                // Actualizar historial completo con las marcas correspondientes
                listaSugerencias.forEach(item => {
                    var esTop3Global = itemsTop3Globales.some(t => t.partido.id === item.partido.id);
                    var esTopLiga = topLigaPorDeporte.some(l => l.partido.id === item.partido.id);

                    if (!historialPredicciones.some(p => p.gameId === item.partido.id)) {
                        historialPredicciones.push({
                            gameId: item.partido.id,
                            sportKey: item.partido.sport_key,
                            market: item.logro.market,
                            selection: item.logro.name,
                            point: item.logro.point, 
                            status: 'pendiente',
                            isTop3: esTop3Global,
                            isTopLiga: esTopLiga
                        });
                    }
                });

                contenedor.innerHTML = htmlFinal;
                localStorage.setItem(REGISTRO_PREDICCIONES, JSON.stringify(historialPredicciones));
            }

            function construirTarjeta(item, claseExtra, textoBadge, infoDep) {
                var partido = item.partido;
                var logro = item.logro;
                var d = new Date(partido.commence_time);
                var h = d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();

                var badgeClase = claseExtra === 'top3-premium' ? 'badge-top3' : (claseExtra === 'liga-premium' ? 'badge-liga-top' : 'badge-sistema');

                return `
                    <div class="card-juego ${claseExtra}">
                        <div class="card-header">
                            <div class="badges-grupo">
                                <span class="${badgeClase}">${textoBadge}</span>
                                <span class="badge-liga">${infoDep.icono} ${infoDep.nombre}</span>
                            </div>
                            <span>${h}</span>
                        </div>
                        <div class="duelo-equipos">
                            <div>${infoDep.icono} ${partido.away_team}</div>
                            <div>🏠 ${partido.home_team}</div>
                        </div>
                        <div class="bloque-sugerencia-automatica">
                            <div class="info-sugerencia">
                                <span class="tag-tipo-logro">${logro.label}</span>
                                <span class="seleccion-texto">${logro.name}</span>
                            </div>
                            <div class="cuota-valor">${logro.price}</div>
                        </div>
                    </div>
                `;
            }

            async function verificarResultados() {
                try {
                    var str = localStorage.getItem(REGISTRO_PREDICCIONES);
                    if (!str) return;
                    var predicciones = JSON.parse(str);
                    var pendientes = predicciones.filter(p => p.status === 'pendiente');
                    if (pendientes.length === 0) return;

                    var ligasPendientes = [...new Set(pendientes.map(p => p.sportKey || 'baseball_mlb'))];

                    var promesasScores = ligasPendientes.map(sportKey => {
                        var url = 'https://api.the-odds-api.com/v4/sports/' + sportKey + '/scores/?daysFrom=3&apiKey=' + API_KEY;
                        return fetch(url).then(res => res.ok ? res.json() : []).catch(() => []);
                    });

                    var resultadosScores = await Promise.all(promesasScores);
                    var scores = resultadosScores.flat();
                    var cambios = false;

                    predicciones.forEach(pred => {
                        if (pred.status !== 'pendiente') return;
                        var juego = scores.find(s => s.id === pred.gameId);
                        if (juego && juego.completed && juego.scores) {
                            var homeS = parseInt((juego.scores.find(s => s.name === juego.home_team) || {score:0}).score);
                            var awayS = parseInt((juego.scores.find(s => s.name === juego.away_team) || {score:0}).score);
                            
                            if (pred.market === 'h2h') {
                                pred.status = (pred.selection === (homeS > awayS ? juego.home_team : juego.away_team)) ? 'ganada' : 'perdida';
                            } else if (pred.market === 'spreads') {
                                var v = parseFloat(pred.point);
                                pred.status = (pred.selection === juego.home_team ? (homeS+v > awayS) : (awayS+v > homeS)) ? 'ganada' : 'perdida';
                            } else if (pred.market === 'totals') {
                                var t = homeS + awayS;
                                var p = parseFloat(pred.point);
                                pred.status = (pred.selection.toLowerCase() === 'over' ? t > p : t < p) ? 'ganada' : 'perdida';
                            }
                            cambios = true;
                        }
                    });

                    if (cambios) localStorage.setItem(REGISTRO_PREDICCIONES, JSON.stringify(predicciones));
                } catch(e) {}
            }

            function actualizarDashboard() {
                try {
                    var str = localStorage.getItem(REGISTRO_PREDICCIONES);
                    if (!str) return;
                    var historial = JSON.parse(str);
                    
                    var totalGlobal = 0, ganadasGlobal = 0;
                    var totalTop3 = 0, ganadasTop3 = 0;

                    historial.forEach(p => {
                        if (p.status !== 'pendiente') {
                            totalGlobal++;
                            if (p.status === 'ganada') ganadasGlobal++;
                            if (p.isTop3) {
                                totalTop3++;
                                if (p.status === 'ganada') ganadasTop3++;
                            }
                        }
                    });

                    var elWinGlobal = document.getElementById('global-winrate');
                    var elContGlobal = document.getElementById('global-conteo');
                    if(elWinGlobal) elWinGlobal.innerText = (totalGlobal > 0 ? Math.round((ganadasGlobal / totalGlobal) * 100) : 0) + '%';
                    if(elContGlobal) elContGlobal.innerText = ganadasGlobal + ' ✓ / ' + totalGlobal + ' Eval';

                    var elWinTop3 = document.getElementById('top3-winrate');
                    var elContTop3 = document.getElementById('top3-conteo');
                    if(elWinTop3) elWinTop3.innerText = (totalTop3 > 0 ? Math.round((ganadasTop3 / totalTop3) * 100) : 0) + '%';
                    if(elContTop3) elContTop3.innerText = ganadasTop3 + ' ✓ / ' + totalTop3 + ' Eval';
                } catch(e) {}
            }

            // Flujo de inicio limpio
            try {
                var cacheStr = localStorage.getItem(CACHE_JUEGOS);
                var timestamp = localStorage.getItem(CACHE_TIEMPO);
                var ahora = new Date().getTime();

                if (cacheStr && timestamp && (ahora - timestamp < 4 * 60 * 60 * 1000)) {
                    var partidosGuardados = JSON.parse(cacheStr);
                    if (partidosGuardados && partidosGuardados.length > 0) {
                        procesarConsensoMercado(partidosGuardados);
                        await verificarResultados();
                        actualizarDashboard();
                    } else {
                        await descargarDatos();
                    }
                } else {
                    await descargarDatos();
                }
            } catch (error) {
                if(contenedor) contenedor.innerHTML = '<div class="error-texto">⚠️ Error al iniciar: ' + error.message + '</div>';
            }
        })();
    </script>
</body>
</html>
