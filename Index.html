<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPA - Sistema de Apuestas y Métricas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .contenedor-principal {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Barra de selección de ligas */
        .selector-ligas {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn-liga {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-liga.activo {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        .btn-liga:hover {
            border-color: var(--accent);
            color: var(--text-color);
        }

        .estado-carga {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 40px;
        }

        .tarjeta-partido {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .cabecera-encuentro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .equipos {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .estado-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .seccion-cuotas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .caja-cuota {
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .caja-cuota span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .caja-cuota strong {
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .seccion-probabilidad {
            margin-top: 15px;
        }

        .barra-container {
            background: var(--border);
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
            display: flex;
            margin: 8px 0;
        }

        .barra-local {
            background: #38bdf8;
            height: 100%;
            transition: width 0.5s ease;
        }

        .barra-visitante {
            background: #f43f5e;
            height: 100%;
            transition: width 0.5s ease;
        }

        .etiquetas-prob {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-vig {
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <header>
            <h1>📊 SIPA - Sistema de Apuestas</h1>
            <p>Métricas, Cuotas y Probabilidades en Vivo (MLB, NBA y NHL)</p>
        </header>

        <!-- Selector de Ligas -->
        <div class="selector-ligas">
            <button class="btn-liga activo" onclick="cambiarDeporte('baseball', this)">⚾ MLB (Béisbol)</button>
            <button class="btn-liga" onclick="cambiarDeporte('basketball', this)">🏀 NBA (Baloncesto)</button>
            <button class="btn-liga" onclick="cambiarDeporte('hockey', this)">🏒 NHL (Hockey)</button>
        </div>

        <div id="contenedor-partidos">
            <div class="estado-carga">Selecciona una liga para cargar los encuentros...</div>
        </div>
    </div>

    <script>
        const API_KEY = 'b55dc1db9b4f0aea7bdd5100a9952c00';
        
        const URLs_DEPORTES = {
            baseball: 'https://v1.baseball.api-sports.io',
            basketball: 'https://v1.basketball.api-sports.io',
            hockey: 'https://v1.hockey.api-sports.io'
        };

        let deporteActual = 'baseball';

        function cambiarDeporte(deporte, elementoBtn) {
            deporteActual = deporte;
            document.querySelectorAll('.btn-liga').forEach(btn => btn.classList.remove('activo'));
            elementoBtn.classList.add('activo');
            cargarDatosDeporte(deporte);
        }

        async function cargarDatosDeporte(deporte) {
            const contenedor = document.getElementById('contenedor-partidos');
            contenedor.innerHTML = `<div class="estado-carga">Sincronizando analíticas de ${deporte.toUpperCase()}...</div>`;

            const baseUrl = URLs_DEPORTES[deporte];

            try {
                const fechaHoy = new Date().toISOString().split('T')[0];
                
                const respuesta = await fetch(`${baseUrl}/games?date=${fechaHoy}`, {
                    method: 'GET',
                    headers: { 'x-apisports-key': API_KEY }
                });

                if (!respuesta.ok) throw new Error('Error al conectar con la API');

                const resultado = await respuesta.json();
                
                if (resultado.response && resultado.response.length > 0) {
                    renderizarPanel(resultado.response);
                } else {
                    cargarDatosDePrueba(deporte);
                }

            } catch (error) {
                console.error('Error de red o API:', error);
                cargarDatosDePrueba(deporte);
            }
        }

        function calcularProbabilidades(cuotaLocal, cuotaVisitante) {
            if (!cuotaLocal || !cuotaVisitante || cuotaLocal <= 1 || cuotaVisitante <= 1) {
                return { local: '50.00', visitante: '50.00', margen: '0.00' };
            }

            const probLocalImplícita = (1 / cuotaLocal) * 100;
            const probVisitanteImplícita = (1 / cuotaVisitante) * 100;

            const sumaProbabilidades = probLocalImplícita + probVisitanteImplícita;
            const margenCasa = sumaProbabilidades - 100;

            const probRealLocal = (probLocalImplícita / sumaProbabilidades) * 100;
            const probRealVisitante = (probVisitanteImplícita / sumaProbabilidades) * 100;

            return {
                local: probRealLocal.toFixed(1),
                visitante: probRealVisitante.toFixed(1),
                margen: margenCasa.toFixed(1)
            };
        }

        function renderizarPanel(partidos) {
            const contenedor = document.getElementById('contenedor-partidos');
            contenedor.innerHTML = '';

            partidos.forEach(partido => {
                const cuotaLocal = 1.90; 
                const cuotaVisitante = 1.90;
                const probs = calcularProbabilidades(cuotaLocal, cuotaVisitante);

                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-partido';

                tarjeta.innerHTML = `
                    <div class="cabecera-encuentro">
                        <div class="equipos">
                            <span>🏠 ${partido.teams?.home?.name || 'Local'}</span>
                            <span style="color: var(--text-muted); font-weight: normal;">vs</span>
                            <span>✈️ ${partido.teams?.away?.name || 'Visitante'}</span>
                        </div>
                        <span class="estado-badge">${partido.status?.short || 'EN VIVO'}</span>
                    </div>

                    <div class="seccion-cuotas">
                        <div class="caja-cuota">
                            <span>Cuota Local</span>
                            <strong>${cuotaLocal}</strong>
                        </div>
                        <div class="caja-cuota">
                            <span>Cuota Visitante</span>
                            <strong>${cuotaVisitante}</strong>
                        </div>
                    </div>

                    <div class="seccion-probabilidad">
                        <div class="etiquetas-prob">
                            <span>${partido.teams?.home?.name || 'Local'}: <strong>${probs.local}%</strong></span>
                            <span>${partido.teams?.away?.name || 'Visitante'}: <strong>${probs.visitante}%</strong></span>
                        </div>
                        <div class="barra-container">
                            <div class="barra-local" style="width: ${probs.local}%;"></div>
                            <div class="barra-visitante" style="width: ${probs.visitante}%;"></div>
                        </div>
                        <div class="info-vig">Margen de la casa (Vig): ${probs.margen}%</div>
                    </div>
                `;

                contenedor.appendChild(tarjeta);
            });
        }

        function cargarDatosDePrueba(deporte) {
            const simulados = {
                baseball: [
                    { teams: { home: { name: 'New York Yankees' }, away: { name: 'Boston Red Sox' } }, status: { short: 'MLB' } }
                ],
                basketball: [
                    { teams: { home: { name: 'Los Angeles Lakers' }, away: { name: 'Golden State Warriors' } }, status: { short: 'NBA' } }
                ],
                hockey: [
                    { teams: { home: { name: 'Montreal Canadiens' }, away: { name: 'Toronto Maple Leafs' } }, status: { short: 'NHL' } }
                ]
            };

            renderizarPanel(simulados[deporte]);
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatosDeporte('baseball');
        });
    </script>
</body>
</html>
